name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test + clippy (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: winrsbox
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: winrsbox

      # Compile the whole workspace including benches + the escape-test bins.
      - name: Build
        run: cargo build --workspace --all-targets

      # `--lib --bins`, not `--lib`. The launcher's own logic — target
      # resolution, console ownership, the Ctrl+C decision table, the child
      # drain — lives in the BIN target (`launcher/src/main.rs` and its
      # modules), so `--lib` alone silently skipped 123 tests of it.
      #
      # Still excluded: `winrsbox/integration-tests/tests/*.rs`. Those ARE
      # cargo tests (~123, including 90 that drive a real sandbox and assert
      # containment), and they are the ones that would have caught the
      # copy-on-write, pipe/console, `--guard static` and exit-code
      # regressions this CI stayed green through. They need a built launcher
      # + hook.dll and roughly three minutes of live process launching, so
      # enabling them here is a deliberate decision, not a cleanup. Until
      # then, understand that a green tick covers unit-level logic only.
      - name: Test
        run: cargo test --workspace --lib --bins

      # Lint visibility (warnings are not denied: the tree has known, accepted
      # style warnings). Fails only on clippy errors / compile errors.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

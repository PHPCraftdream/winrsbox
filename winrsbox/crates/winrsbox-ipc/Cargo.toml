[package]
name = "winrsbox-ipc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "winrsbox hook↔launcher IPC protocol (bincode over named pipe)"
repository = "https://github.com/PHPCraftdream/winrsbox"
# Internal implementation crate — released as source with winrsbox, not to crates.io.
publish = false

[dependencies]
serde = { workspace = true }
bincode = { workspace = true }
policy = { package = "winrsbox-policy", path = "../winrsbox-policy" }
thiserror = "1"

[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "msg"
harness = false

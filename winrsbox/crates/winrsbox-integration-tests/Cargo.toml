[dependencies]
policy = { package = "winrsbox-policy", path = "../winrsbox-policy" }
serde_json = "1"
winapi = { version = "0.3", features = ["memoryapi", "winnt", "processthreadsapi", "libloaderapi", "errhandlingapi", "tlhelp32", "handleapi", "winreg", "minwindef", "fileapi", "ioapiset", "processenv", "winuser", "synchapi", "winbase", "jobapi2", "combaseapi", "winsvc", "namedpipeapi", "securitybaseapi"] }
ntapi = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
assert_cmd = "2"
predicates = "3"
winrsbox = { path = "../winrsbox-launcher" }

